name: Render Keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API health
        env:
          ALP_API_URL: ${{ secrets.ALP_API_URL }}
        run: |
          API_URL="${ALP_API_URL:-https://alp-hayvan-takip-api.onrender.com}"
          for attempt in 1 2 3; do
            response="$(curl --fail --silent --show-error --max-time 75 "$API_URL/api/health" || true)"
            if printf '%s' "$response" | grep -q '"status":"ok"'; then
              echo "Render health check passed."
              exit 0
            fi
            echo "Health check attempt $attempt did not return ready status."
            sleep 12
          done
          echo "Render service did not become ready."
          exit 1
