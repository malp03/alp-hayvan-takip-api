name: Render Keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health
        continue-on-error: true
        env:
          ALP_API_URL: ${{ secrets.ALP_API_URL }}
        run: |
          if [ -z "$ALP_API_URL" ]; then
            echo "ALP_API_URL secret is not set; skipping keepalive."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 75 --retry 2 --retry-delay 8 "$ALP_API_URL/api/health"
