services:
  - type: web
    name: alp-hayvan-takip-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALP_AUTH_SECRET
        sync: false
      - key: ALP_API_CORS_ORIGINS
        value: "*"
